<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>执掌东大</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <section id="androidEcodeCard" class="android-ecode-card" hidden aria-label="校园 E 码通">
        <div class="android-ecode-qr-shell">
          <img id="androidEcodeQr" class="android-ecode-qr" alt="校园 E 码通二维码" hidden />
        </div>
        <div id="androidEcodeTime" class="android-ecode-time" hidden></div>
        <div id="androidEcodeUnavailable" class="android-ecode-unavailable" hidden>校园 E 码通暂时无法读取</div>
      </section>

      <aside class="desktop-sidebar" aria-label="主导航">
        <div class="sidebar-brand">
          <div class="brand-mark" aria-hidden="true">NEU</div>
          <div>
            <strong>执掌东大</strong>
            <span>教务工具</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <button class="nav-item is-active" data-view="overview" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg>
            <span>总览</span>
          </button>
          <button class="nav-item" data-view="personal" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm3 8h3m-3 4h3m3-4h3m-3 4h3"/></svg>
            <span>课表</span>
          </button>
          <button class="nav-item" data-view="exams" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v3m12-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm3 8h.01m3 0h.01m3 0h.01m-6 4h.01m3 0h.01m3 0h.01"/></svg>
            <span>考试</span>
          </button>
          <button class="nav-item" data-view="scores" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10m7 10V4m7 16v-7"/></svg>
            <span>成绩</span>
          </button>
          <button class="nav-item" data-view="all" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 5v14m8-14v14M4 10h16M4 15h16"/></svg>
            <span>全校课表</span>
          </button>
          <button class="nav-item" data-view="curriculum" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Zm0 0v13a3 3 0 0 0 3 3m3-12h7m-7 4h7"/></svg>
            <span>培养计划</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <button class="nav-item" data-view="settings" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.6 4.7.5-1.7h3.8l.5 1.7 1.4.8 1.7-.5 1.9 3.3-1.2 1.2v1.6l1.2 1.2-1.9 3.3-1.7-.5-1.4.8-.5 1.7h-3.8l-.5-1.7-1.4-.8-1.7.5-1.9-3.3 1.2-1.2V9.5L4.6 8.3l1.9-3.3 1.7.5 1.4-.8ZM12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/></svg>
            <span>设置</span>
          </button>
        </div>
      </aside>

      <div class="main-shell">
        <header class="app-toolbar">
          <div class="toolbar-title-group">
            <h1 id="pageTitle">总览</h1>
          </div>
          <div class="toolbar-actions">
            <label class="toolbar-term" title="成绩、考试和个人课表使用的学期">
              <span>学期</span>
              <select id="termSelect" disabled>
                <option>正在读取学期…</option>
              </select>
            </label>
            <span id="connectionStatus" class="connection is-loading">正在连接</span>
            <span id="updatedAt" class="updated-at">等待数据</span>
            <button id="refreshButton" class="icon-button" type="button" aria-label="刷新数据" title="刷新数据">↻</button>
            <button id="openPortal" class="button button-ghost toolbar-portal-button" type="button">原教务系统</button>
          </div>
        </header>

        <main class="page-wrap">
          <div id="notice" class="notice" hidden aria-hidden="true"></div>
          <section id="content" class="content-area" aria-live="polite"></section>
        </main>

        <nav class="mobile-bottom-nav" aria-label="移动端主导航">
          <button class="mobile-nav-item is-active" data-view="overview" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg>
            <span>首页</span>
          </button>
          <button class="mobile-nav-item" data-view="personal" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm3 8h3m-3 4h3m3-4h3m-3 4h3"/></svg>
            <span>课表</span>
          </button>
          <button class="mobile-nav-item" data-view="scores" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10m7 10V4m7 16v-7"/></svg>
            <span>成绩</span>
          </button>
          <button class="mobile-nav-item" data-view="exams" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v3m12-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm3 8h.01m3 0h.01m3 0h.01m-6 4h.01m3 0h.01m3 0h.01"/></svg>
            <span>考试</span>
          </button>
          <button class="mobile-nav-item" data-view="settings" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.6 4.7.5-1.7h3.8l.5 1.7 1.4.8 1.7-.5 1.9 3.3-1.2 1.2v1.6l1.2 1.2-1.9 3.3-1.7-.5-1.4.8-.5 1.7h-3.8l-.5-1.7-1.4-.8-1.7.5-1.9-3.3 1.2-1.2V9.5L4.6 8.3l1.9-3.3 1.7.5 1.4-.8ZM12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/></svg>
            <span>更多</span>
          </button>
        </nav>
      </div>
    </div>
    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="vendor/html2canvas.min.js"></script>
    <script src="vendor/jspdf.umd.min.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
